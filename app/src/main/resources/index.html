<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance System</title>
<style>
body{font-family:Arial,sans-serif;background:#fff6f5;color:#401c2b;margin:0;padding:16px}
header{background:#641b35;color:white;text-align:center;padding:20px;border-radius:12px}
.card{background:white;padding:18px;margin:18px auto;border-radius:12px;max-width:500px;box-shadow:0 3px 10px #0001}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;font-size:16px}
input{border:1px solid #ccc}
button{background:#842849;color:white;border:0}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:center;font-size:13px}
.small-btn{padding:8px 4px;font-size:12px}
.stats{font-weight:bold;color:#842849}
</style>
</head>
<body>
<header>
<h1>🎓 Smart Attendance</h1>
<p>Student Attendance Management System</p>
</header>

<div class="card" id="loginCard">
<h2>🔐 Login</h2>
<form id="loginForm">
<input id="loginUsername" autocomplete="username"
       placeholder="Username" required>
<input id="loginPassword" type="password"
       autocomplete="current-password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p id="loginMessage" role="status"></p>
</div>

<div id="attendanceApp" hidden>
<div class="card">
<p id="accountInfo"></p>
<button id="logoutButton" type="button" hidden>Logout</button>
</div>

<div class="card">
<h2>Add Student</h2>
<input id="name" placeholder="Enter student name">
<input id="roll" placeholder="Enter roll number">
<button onclick="addStudent()">Add Student</button>
</div>

<div class="card">
<h2>📋 Student Attendance</h2>
<p>Mark each student's attendance for today.</p>
<input type="text" id="searchStudent"
placeholder="Search by name or roll number..."
oninput="render()"
style="width:90%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc;">
<div id="studentList">No students added yet.</div>
</div>

<div class="card">
<h2>📊 Attendance Summary</h2>
<p class="stats" id="summary">Total Students: 0</p>
<p>Present: <span id="present">0</span></p>
<p>Absent: <span id="absent">0</span></p>
<p>Overall Attendance: <span id="percentage">0%</span></p>
</div>
</div>
<script>
const API = "https://smart-attendance-management-system-nns0.onrender.com/api/students";
const LOGIN_API = "https://smart-attendance-management-system-nns0.onrender.com/api/login";
const LOGOUT_API = "https://smart-attendance-management-system-nns0.onrender.com/api/logout";

let students = [];
let token = sessionStorage.getItem("attendanceToken") || "";
let currentUser = JSON.parse(sessionStorage.getItem("attendanceUser") || "null");

function apiFetch(url, options = {}) {
    const headers = {
        ...(options.headers || {}),
        "Authorization": "Bearer " + token
    };
    return fetch(url, {...options, headers});
}

function showLoggedIn(user) {
    currentUser = user;
    document.getElementById("loginCard").hidden = true;
    document.getElementById("attendanceApp").hidden = false;
    document.getElementById("logoutButton").hidden = false;
    document.getElementById("accountInfo").textContent =
        "Logged in as " + user.username + " (" + user.role + ")";

    const manager = user.role === "ADMIN" || user.role === "TEACHER";
    document.getElementById("name").parentElement.hidden = !manager;
    loadStudents();
}

function showLoggedOut() {
    token = "";
    currentUser = null;
    students = [];
    sessionStorage.removeItem("attendanceToken");
    sessionStorage.removeItem("attendanceUser");
    document.getElementById("loginCard").hidden = false;
    document.getElementById("attendanceApp").hidden = true;
    document.getElementById("logoutButton").hidden = true;
    document.getElementById("loginPassword").value = "";
    document.getElementById("loginMessage").textContent = "";
}

document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const message = document.getElementById("loginMessage");
    message.textContent = "Logging in...";

    try {
        const response = await fetch(LOGIN_API, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: document.getElementById("loginUsername").value.trim(),
                password: document.getElementById("loginPassword").value
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Login failed.");

        token = data.token;
        currentUser = {username: data.username, role: data.role};
        sessionStorage.setItem("attendanceToken", token);
        sessionStorage.setItem("attendanceUser", JSON.stringify(currentUser));

        message.textContent = "";
        showLoggedIn(currentUser);
    } catch (error) {
        message.textContent = error.message || "Could not connect to the backend.";
    }
});

document.getElementById("logoutButton").addEventListener("click", async () => {
    try {
        if (token) {
            await apiFetch(LOGOUT_API, {method: "POST"});
        }
    } finally {
        showLoggedOut();
    }
});

async function loadStudents() {
    try {
        const response = await apiFetch(API);
        if (response.status === 401) {
            showLoggedOut();
            throw new Error("Session expired. Please log in again.");
        }
        if (!response.ok) throw new Error("Could not load students.");
        students = await response.json();
        render();
    } catch (error) {
        alert(error.message || "Could not connect to the backend.");
    }
}

async function addStudent() {
    if (!currentUser || !["ADMIN", "TEACHER"].includes(currentUser.role)) return;

    const name = document.getElementById("name").value.trim();
    const roll = document.getElementById("roll").value.trim();

    if (!name || !roll) {
        alert("Please enter both student name and roll number.");
        return;
    }

    if (students.some(s => s.roll === roll)) {
        alert("This roll number already exists.");
        return;
    }

    try {
        const response = await apiFetch(API, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name, roll, days: 0, present: 0, today: ""})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Student could not be saved.");

        document.getElementById("name").value = "";
        document.getElementById("roll").value = "";
        await loadStudents();
        alert("Student added successfully!");
    } catch (error) {
        alert(error.message);
    }
}

async function mark(index, status) {
    if (!currentUser || !["ADMIN", "TEACHER"].includes(currentUser.role)) return;
    const student = students[index];
    if (!student) return;

    const today = new Date().toLocaleDateString("en-CA");
    if (student.today === today) {
        alert("Attendance already marked for today.");
        return;
    }

    const updatedStudent = {
        ...student,
        days: Number(student.days || 0) + 1,
        present: Number(student.present || 0) + (status === "Present" ? 1 : 0),
        today
    };

    try {
        const response = await apiFetch(API, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(updatedStudent)
        });
        if (!response.ok) throw new Error("Attendance update failed.");
        await loadStudents();
    } catch (error) {
        alert(error.message);
    }
}

async function editStudent(index) {
    if (!currentUser || !["ADMIN", "TEACHER"].includes(currentUser.role)) return;
    const student = students[index];
    if (!student) return;

    const newName = prompt("Enter student name:", student.name);
    if (newName === null) return;
    const newRoll = prompt("Enter roll number:", student.roll);
    if (newRoll === null) return;

    if (!newName.trim() || !newRoll.trim()) {
        alert("Name and roll number cannot be empty.");
        return;
    }

    try {
        const response = await apiFetch(API, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                roll: student.roll,
                newRoll: newRoll.trim(),
                name: newName.trim()
            })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not update student.");

        alert("Student updated successfully!");
        await loadStudents();
    } catch (error) {
        alert(error.message);
    }
}

async function deleteStudent(index) {
    if (!currentUser || !["ADMIN", "TEACHER"].includes(currentUser.role)) return;
    const student = students[index];
    if (!student || !confirm("Delete " + student.name + "?")) return;

    try {
        const response = await apiFetch(
            API + "?roll=" + encodeURIComponent(student.roll),
            {method: "DELETE"}
        );
        if (!response.ok) throw new Error("Could not delete student.");

        alert("Student deleted successfully!");
        await loadStudents();
    } catch (error) {
        alert(error.message);
    }
}

function render() {
    const list = document.getElementById("studentList");
    const manager = currentUser && ["ADMIN", "TEACHER"].includes(currentUser.role);
    const searchBox = document.getElementById("searchStudent");
    const query = searchBox ? searchBox.value.trim().toLowerCase() : "";

    const filtered = students
        .map((student, index) => ({student, index}))
        .filter(item =>
            String(item.student.name).toLowerCase().includes(query) ||
            String(item.student.roll).toLowerCase().includes(query)
        );

    if (!filtered.length) {
        list.textContent = query ? "No matching students found." : "No students added yet.";
    } else {
        list.innerHTML = "<table><tr><th>Name</th><th>Roll No.</th><th>Attendance</th>" +
            (manager ? "<th>Action</th>" : "") + "</tr>" +
            filtered.map(({student: s, index: i}) =>
                "<tr><td>" + escapeHTML(s.name) +
                "</td><td>" + escapeHTML(s.roll) +
                "</td><td>" + (manager
                    ? "<button class='small-btn' onclick='mark(" + i + ",\"Present\")'>Present</button>" +
                      "<button class='small-btn' onclick='mark(" + i + ",\"Absent\")'>Absent</button><br>"
                    : "") +
                Number(s.present || 0) + "/" + Number(s.days || 0) +
                "</td>" + (manager
                    ? "<td><button class='small-btn' onclick='editStudent(" + i + ")'>Edit</button>" +
                      "<button class='small-btn' onclick='deleteStudent(" + i + ")'>Delete</button></td>"
                    : "") + "</tr>"
            ).join("") + "</table>";
    }

    const total = students.length;
    const present = students.reduce((sum, s) => sum + Number(s.present || 0), 0);
    const days = students.reduce((sum, s) => sum + Number(s.days || 0), 0);

    document.getElementById("summary").textContent = "Total Students: " + total;
    document.getElementById("present").textContent = present;
    document.getElementById("absent").textContent = days - present;
    document.getElementById("percentage").textContent =
        (days ? Math.round(present / days * 100) : 0) + "%";
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    }[c]));
}

if (token && currentUser) {
    showLoggedIn(currentUser);
} else {
    showLoggedOut();
}
</script>

</body>
</html>
